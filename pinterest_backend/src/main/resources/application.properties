spring.application.name=Pinterest

# =========================
# SERVER CONFIG
# =========================
server.port=8080
# =========================
# DATABASE (MySQL)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/pinterest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / HIBERNATE CONFIG
# =========================
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=trues
#spring.jpa.properties.hibernate.format_sql=true
# =========================
# JACKSON JSON CONFIG
# =========================
spring.jackson.serialization.write-dates-as-timestamps=false
# =========================
# JWT CONFIG
# =========================
jwt.secret=f7a3c9d8b12e4f73c6f920ab7d1189c4a51d2e7bb894f6d1c3e842bc7f2a9ed3
jwt.expiration=86400000
# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger

# =========================
# FILE UPLOAD (optional)
# =========================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB